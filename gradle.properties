# --- Plugin coordinates ---
pluginGroup = io.github.janipasanen.claudeagent
pluginName = Claude Agent
pluginVersion = 0.1.0

# Compatibility range. All of Rider/WebStorm/Android Studio 2026.1 share branch 261,
# so one artifact covers them. Compatibility ranges omit the product code on purpose.
pluginSinceBuild = 261
pluginUntilBuild = 261.*

# --- Target platform ---
# Since 2025.3 (253) IDEA Community (IC) is no longer published; the unified IntelliJ IDEA
# distribution uses the IU coordinate. We still depend only on com.intellij.modules.platform
# (see plugin.xml) so the artifact stays product-agnostic and loads in Rider/WebStorm/Android Studio.
# Override per build-matrix branch, e.g. -PplatformVersion=2025.2
platformType = IU
platformVersion = 2026.1

# --- Gradle ---
org.gradle.jvmargs = -Xmx2g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.configuration-cache = false

# The IntelliJ Platform provides the Kotlin stdlib at runtime; do not bundle our own.
kotlin.stdlib.default.dependency = false
