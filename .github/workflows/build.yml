name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin --no-configuration-cache

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-agent-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    # Plugin Verifier downloads IDEs; allow it to fail without blocking the build for now (M3 hardens this).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --no-configuration-cache
